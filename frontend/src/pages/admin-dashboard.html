<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - STAFIN Homes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-gray-900">STAFIN Homes</h1>
                    <span class="ml-4 text-gray-500">Admin Dashboard</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="add-property-btn"
                        class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition font-medium">
                        Add Property
                    </button>
                    <button id="logout-btn" class="text-gray-600 hover:text-gray-900 transition font-medium">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Loading State -->
        <div id="loading-state" class="text-center py-12">
            <div
                class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-200 border-t-indigo-600">
            </div>
            <p class="text-gray-600 mt-4">Loading properties...</p>
        </div>

        <!-- Error State -->
        <div id="error-state" class="hidden">
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-6 rounded-lg">
                <p id="error-title" class="font-medium">Error occurred</p>
                <p id="error-message" class="mt-1"></p>
                <button id="retry-btn" class="mt-4 text-red-700 underline hover:text-red-900">
                    Try again
                </button>
            </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
            <h3 class="mt-2 text-sm font-medium text-gray-900">No properties</h3>
            <p class="mt-1 text-sm text-gray-500">Get started by adding your first property.</p>
            <button id="empty-add-btn"
                class="mt-6 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition font-medium">
                Add Property
            </button>
        </div>

        <!-- Navigation Tabs -->
        <div class="mb-8 border-b border-gray-200">
            <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                <button id="tab-properties"
                    class="border-indigo-500 text-indigo-600 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors cursor-pointer">
                    Properties
                </button>
                <button id="tab-inquiries"
                    class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors cursor-pointer">
                    Inquiries
                </button>
            </nav>
        </div>

        <!-- Property List -->
        <div id="property-section" class="">
            <div class="bg-white shadow rounded-lg">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h2 class="text-lg font-medium text-gray-900">Properties</h2>
                </div>
                <div id="table-container" class="p-6">
                    <!-- Property table will be rendered here -->
                </div>
            </div>
        </div>

        <!-- Inquiries List -->
        <div id="inquiry-section" class="hidden">
            <div class="bg-white shadow rounded-lg">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h2 class="text-lg font-medium text-gray-900">Latest Leads / Inquiries</h2>
                </div>
                <div id="inquiry-table-container" class="p-6">
                    <!-- Inquiry table will be rendered here -->
                </div>
            </div>
        </div>

        <!-- Form Modal -->
        <div id="form-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-lg shadow-xl max-w-3xl w-full mx-4 max-h-[90vh] overflow-y-auto">
                <div id="form-container">
                    <!-- Form will be rendered here -->
                </div>
            </div>
        </div>
    </main>

    <script src="/src/js/api/auth.js"></script>
    <script src="/src/js/api/propertyApi.js?v=issue10_deletefix"></script>
    <script src="/src/js/api/contactApi.js?v=issue11"></script>
    <script src="/src/js/components/propertyTable.js"></script>
    <script src="/src/js/components/inquiryTable.js?v=issue11"></script>
    <script src="/src/js/components/propertyForm.js?v=issue10_3"></script>
    <script src="/src/js/components/toast.js"></script>
    <script src="/src/js/pages/adminDashboard.js?v=issue11_crm"></script>
</body>

</html>
