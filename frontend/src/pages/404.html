<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stafin Homes</title>
    <!-- Tailwind CSS (via local build or CDN) -->
    <link href="/output.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="/src/images/gemini-svg.svg">
    <link rel="shortcut icon" href="/src/images/gemini-svg.svg">
    <link rel="apple-touch-icon" href="/src/images/gemini-svg.svg">
</head>

<body
    class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 antialiased min-h-screen flex flex-col transition-colors duration-300">

    <!-- Navbar Component Container -->
    <div id="navbar"></div>

    <main class="flex-grow flex items-center justify-center p-6 text-center">
        <div class="max-w-md w-full animate-fade-in-up">
            <h1 class="text-9xl font-extrabold text-primary mb-2">404</h1>
            <h2 class="text-3xl font-bold text-gray-900 mb-6">Page Not Found</h2>
            <p class="text-gray-600 dark:text-gray-400 mb-8 leading-relaxed">
                Oops! The page you were looking for doesn't exist. It might have been moved, deleted, or perhaps the URL
                was mistyped.
            </p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="/"
                    class="px-6 py-3 bg-primary text-white rounded-lg font-semibold hover:bg-primary-light transition shadow-md">
                    Back to Homepage
                </a>
                <a href="/contact/"
                    class="px-6 py-3 bg-white text-primary border border-primary rounded-lg font-semibold hover:bg-gray-50 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-200 dark:hover:bg-gray-700 transition shadow-sm">
                    Contact Support
                </a>
            </div>
        </div>
    </main>

    <!-- Footer Component Container -->
    <div id="footer"></div>

    <!-- Main Entry JS -->
    <script src="/src/js/config.js"></script>
    <script src="/src/js/main.js"></script>
</body>

</html>
