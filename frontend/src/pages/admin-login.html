<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - STAFIN Homes</title>
    <link href="/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/src/images/gemini-svg.svg">
    <link rel="shortcut icon" href="/src/images/gemini-svg.svg">
    <link rel="apple-touch-icon" href="/src/images/gemini-svg.svg">
</head>

<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">STAFIN Homes</h1>
            <p class="text-gray-600 mt-2">Admin Portal</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    Email
                </label>
                <input type="email" id="email" name="email" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="admin@stafinhomes.com" />
                <p id="email-error" class="text-red-500 text-sm mt-1 hidden"></p>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    Password
                </label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="••••••••" />
                <p id="password-error" class="text-red-500 text-sm mt-1 hidden"></p>
            </div>

            <div id="form-error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg hidden">
            </div>

            <button type="submit" id="submit-btn"
                class="w-full bg-primary text-white py-3 px-4 rounded-lg hover:bg-primary-light transition font-medium">
                Sign In
            </button>
        </form>

        <div id="loading-state" class="hidden text-center py-4">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-gray-200 border-t-primary"></div>
            <p class="text-gray-600 mt-2">Signing in...</p>
        </div>
    </div>

    <script src="/src/js/config.js"></script>
    <script src="/src/js/api/auth.js"></script>
    <script src="/src/js/pages/adminLogin.js"></script>
</body>

</html>
