<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properties | Stafin Homes</title>
    <meta name="description"
        content="Browse premium properties for sale, rent, and short let across Nigeria. Filter by location, price, and type.">
    <meta name="keywords"
        content="real estate, nigeria, property listings, homes for sale, apartments for rent, short let">
    <!-- OpenGraph Meta Tags -->
    <meta property="og:title" content="Properties | Stafin Homes">
    <meta property="og:description"
        content="Browse premium properties for sale, rent, and short let across Nigeria. Filter by location, price, and type.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://stafinhomes.com/properties/">
    <meta property="og:image" content="https://stafinhomes.com/src/images/gemini-svg.svg">
    <meta property="og:site_name" content="Stafin Homes">
    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Properties | Stafin Homes">
    <meta name="twitter:description"
        content="Browse premium properties for sale, rent, and short let across Nigeria. Filter by location, price, and type.">
    <meta name="twitter:image" content="https://stafinhomes.com/src/images/gemini-svg.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/src/images/gemini-svg.svg">
    <link href="/output.css" rel="stylesheet">
</head>

<body class="flex flex-col min-h-screen bg-gray-50 font-outfit">
    <div id="navbar"></div>

    <main class="flex-grow">
        <!-- Page Header -->
        <section class="bg-primary py-16 relative overflow-hidden">
            <div
                class="absolute inset-0 opacity-10 bg-[url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center">
            </div>
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
                <span class="text-accent font-semibold text-sm uppercase tracking-wider">Properties</span>
                <h1 class="text-4xl md:text-5xl font-bold text-white mt-2">Available Properties</h1>
                <p class="text-gray-300 mt-4 max-w-2xl mx-auto text-lg">Explore our curated collection of premium
                    Nigerian properties.</p>
            </div>
        </section>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <!-- Filter Bar Container -->
            <div id="filter-bar-container"></div>

            <!-- Error State -->
            <div id="error-state" class="hidden text-center py-12" role="alert" aria-live="assertive" tabindex="-1">
                <div class="bg-red-50 border border-red-200 rounded-lg p-6 max-w-md mx-auto">
                    <svg class="w-12 h-12 text-red-500 mx-auto mb-4" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <h3 class="text-lg font-semibold text-red-800 mb-2">Unable to Load Properties</h3>
                    <p class="text-red-600 error-message">Failed to load properties. Please try again later.</p>
                    <button
                        class="retry-button mt-4 px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors">
                        Try Again
                    </button>
                </div>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-12">
                <div class="bg-gray-50 rounded-lg p-8 max-w-md mx-auto">
                    <svg class="w-16 h-16 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <h3 class="text-lg font-semibold text-gray-700 mb-2">No Properties Found</h3>
                    <p class="text-gray-500 empty-message">No properties match your current filters. Try adjusting your
                        search criteria.</p>
                </div>
            </div>

            <!-- Properties Grid -->
            <div id="properties-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" role="region"
                aria-live="polite">
            </div>

            <!-- Pagination Bar Container -->
            <div id="pagination-container" class="mt-8"></div>
        </div>
    </main>

    <div id="footer"></div>

    <!-- Scripts -->
    <script src="/src/js/whatsappConfig.js"></script>
    <script src="/src/js/components/newsTicker.js"></script>
    <script src="/src/js/main.js"></script>
    <script src="/src/js/api/propertyApi.js?v=issue13"></script>
    <script src="/src/js/components/propertyCard.js?v=issue13"></script>
    <script src="/src/js/components/skeletonCard.js?v=issue13"></script>
    <script src="/src/js/components/filterBar.js?v=issue13"></script>
    <script src="/src/js/components/paginationBar.js?v=issue13"></script>
    <script src="/src/js/pages/properties.js?v=issue13"></script>
</body>

</html>
